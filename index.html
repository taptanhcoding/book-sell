<script>
  (function() {
    // Lấy toàn bộ path sau domain (bỏ dấu '/' đầu), kèm query string và hash
    const restPath = window.location.pathname.replace(/^\/+/, '');

    // Trang chủ thì hiển thị bình thường, không chuyển hướng
    if (restPath === '') return;

    const target = 'https://wisdombooks.shop/' + restPath + window.location.search + window.location.hash;

    window.location.replace(target);
  })();
</script>
</html>
